[project]
name = "muse-vae"
version = "0.1.0"
description = "Convolutional VAE for musical mel spectrograms (GTZAN), built with PyTorch Lightning"
requires-python = ">=3.9"
dependencies = [
    "torch",
    "torchaudio",
    "lightning",
    "ruamel.yaml",
    "pandas",
    "numpy",
    "matplotlib",
    "scikit-learn",
    "librosa",
    "wandb",
]

# This project has no installable package; the scripts are run from the repo root.
# The empty list stops setuptools from auto-discovering top-level folders.
[tool.setuptools]
packages = []
